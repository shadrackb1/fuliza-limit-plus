    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --safaricom-green: #47B04B;
        --safaricom-red: #E21F26;
      }
      body {
        font-family: 'Lexend', sans-serif;
        -webkit-tap-highlight-color: transparent;
        background-color: #f8fafc;
      }
      .safaricom-green { color: var(--safaricom-green); }
      .bg-safaricom-green { background-color: var(--safaricom-green); }
      .border-safaricom-green { border-color: var(--safaricom-green); }
      
      /* Subtle brand pattern */
      .bg-pattern {
        background-image: radial-gradient(var(--safaricom-green) 0.5px, transparent 0.5px);
        background-size: 24px 24px;
        opacity: 0.03;
      }

      @keyframes shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      .shimmer {
        position: relative;
        overflow: hidden;
      }
      .shimmer::after {
        content: '';
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
        animation: shimmer 2s infinite;
      }
    </style>
